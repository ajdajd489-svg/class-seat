<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 자리 배치도 (DB 동기화 & 커스텀 드래그 탑재)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #fff; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        
        /* 상단 컨트롤 패널 */
        .control-panel { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; align-items: center; }
        .month-title { font-size: 3rem; font-weight: bold; cursor: text; display: inline-block; padding: 5px 20px; border-bottom: 2px dashed transparent; }
        .month-title:focus { border-bottom: 2px dashed #333; outline: none; }
        
        .mode-btn {
            padding: 10px 20px; font-size: 1rem; font-weight: bold; color: white;
            background-color: #007BFF; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .mode-btn.drag-active { background-color: #DC3545; }
        
        /* 레이아웃 */
        .classroom { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; flex-wrap: wrap; align-items: flex-start; position: relative; }
        
        .group-container { display: flex; flex-direction: column; align-items: center; position: relative; }
        
        /* 모둠 타이틀 (드래그 가능, 수정 가능) */
        .group-title {
            font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; color: #333; 
            padding: 5px; border: 1px dashed transparent; transition: transform 0.1s;
        }
        .group-title:focus { border-color: #333; outline: none; background: #f9f9f9; }
        
        .left-col { display: flex; flex-direction: column; gap: 30px; }
        .group-3 { display: flex; flex-direction: column; align-items: center; }
        .group-3 .top-seat { display: flex; justify-content: center; }
        .group-3 .bottom-seats { display: flex; }
        
        .right-col { display: flex; flex-direction: column; gap: 40px; justify-content: flex-start; margin-top: 10px; }
        .right-row { display: flex; gap: 40px; }
        .group-4 { display: grid; grid-template-columns: 1fr 1fr; }
        
        /* 책상 박스 (드래그 가능 컨테이너) */
        .seat-box {
            position: relative;
            background-color: #2CA973;
            width: 100px;
            height: 50px;
            border: 1px solid rgba(255,255,255,0.4);
            box-sizing: border-box;
            transition: transform 0.1s; /* 부드러운 드래그 */
            z-index: 10;
        }

        .placeholder {
            position: absolute;
            width: 100%; height: 100%; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-weight: bold; font-size: 1.2rem; pointer-events: none; z-index: 1;
        }

        .editable-name {
            position: absolute;
            width: 100%; height: 100%; top: 0; left: 0;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1.2rem;
            outline: none; cursor: text; z-index: 2;
        }
        .editable-name:focus { background-color: #218c5e; }
        
        /* 드래그 모드 활성화 시 스타일 강제 변경 */
        body.drag-mode-on .group-title,
        body.drag-mode-on .seat-box {
            cursor: grab !important;
            border: 2px dashed #DC3545 !important; /* 드래그 가능 요소 표시 */
        }
        body.drag-mode-on .group-title:active,
        body.drag-mode-on .seat-box:active { cursor: grabbing !important; }
        body.drag-mode-on .editable-name,
        body.drag-mode-on .group-title { pointer-events: none; } /* 글자 입력 차단 */

        .chalkboard { font-size: 3rem; font-weight: bold; margin-top: 50px; }
        
        .save-btn {
            margin-top: 20px; padding: 15px 30px; font-size: 1.2rem;
            background-color: #333; color: white; border: none; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }
        .save-btn:hover { background-color: #555; }

        #warning-box { margin-top: 20px; min-height: 30px; color: #d9534f; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

    <!-- 커스텀 드래그 로직 및 UI 컨트롤 -->
    <script>
        let isDragMode = false;
        let activeObj = null;
        let startX, startY, initX, initY;

        // 글자 입력 여부에 따른 플레이스홀더 숨김 처리
        window.checkEmpty = function(el) {
            const placeholder = el.previousElementSibling;
            placeholder.style.display = (el.textContent.trim() !== '') ? 'none' : 'flex';
        };

        // 모드 전환 스위치
        window.toggleDragMode = function() {
            isDragMode = !isDragMode;
            const btn = document.getElementById('modeToggleBtn');
            if(isDragMode) {
                document.body.classList.add('drag-mode-on');
                btn.innerText = "모드: 자리 이동 중 🖱️ (클릭해서 해제)";
                btn.classList.add('drag-active');
            } else {
                document.body.classList.remove('drag-mode-on');
                btn.innerText = "모드: 이름 입력 중 ✏️ (클릭해서 이동)";
                btn.classList.remove('drag-active');
            }
        };

        // 드래그 마우스 이벤트 등록
        document.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('mouseup', dragEnd);
        // 모바일 터치 이벤트 등록
        document.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('touchmove', dragMove, {passive: false});
        document.addEventListener('touchend', dragEnd);

        function getEventPos(e) {
            if(e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            return { x: e.clientX, y: e.clientY };
        }

        function dragStart(e) {
            if (!isDragMode) return;
            let target = e.target.closest('.draggable');
            if (!target) return;
            
            activeObj = target;
            let pos = getEventPos(e);
            startX = pos.x;
            startY = pos.y;
            initX = parseFloat(activeObj.getAttribute('data-x')) || 0;
            initY = parseFloat(activeObj.getAttribute('data-y')) || 0;
            activeObj.style.zIndex = 1000;
        }

        function dragMove(e) {
            if (!activeObj || !isDragMode) return;
            e.preventDefault(); // 스크롤 방지
            let pos = getEventPos(e);
            let dx = pos.x - startX;
            let dy = pos.y - startY;
            let finalX = initX + dx;
            let finalY = initY + dy;
            
            activeObj.style.transform = `translate(${finalX}px, ${finalY}px)`;
            activeObj.setAttribute('data-x', finalX);
            activeObj.setAttribute('data-y', finalY);
        }

        function dragEnd(e) {
            if (!activeObj) return;
            activeObj.style.zIndex = "";
            activeObj = null;
        }
    </script>

    <!-- 파이어베이스 DB 연동 로직 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // ★★★ 파이어베이스 설정 덮어쓰기 ★★★
        const firebaseConfig = {
            apiKey: "AIzaSyDMQJnSwF09W-qKcHGFqzr3fNoQSQN-cq8",
            authDomain: "seat-f3944.firebaseapp.com",
            projectId: "seat-f3944",
            storageBucket: "seat-f3944.firebasestorage.app",
            messagingSenderId: "288606604988",
            appId: "1:288606604988:web:5755e388ee4b9a88814ab9",
            measurementId: "G-TK5G3EWV4X"
        };
        // ★★★ 여기까지 ★★★

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "classroom", "layoutData");

        const BACK_ROW_INDEXES = [0, 1, 2, 9, 10, 11, 12, 13, 14, 15, 16];
        let globalHistory = {};

        // DB에서 데이터 불러와서 렌더링
        async function loadData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('month').innerText = data.month || '9월';
                    globalHistory = data.history || {};
                    
                    // 좌석 텍스트 & 좌표 복원
                    for(let i = 0; i < 25; i++) {
                        const nameEl = document.getElementById(`seat-${i}`);
                        const boxEl = document.getElementById(`sbox-${i}`);
                        
                        if (data.seats && data.seats[i]) {
                            nameEl.innerText = data.seats[i];
                            window.checkEmpty(nameEl);
                        }
                        if (data.positions && data.positions[`sbox-${i}`]) {
                            const pos = data.positions[`sbox-${i}`];
                            boxEl.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                            boxEl.setAttribute('data-x', pos.x);
                            boxEl.setAttribute('data-y', pos.y);
                        }
                    }

                    // 모둠 타이틀 텍스트 & 좌표 복원
                    for(let i = 1; i <= 7; i++) {
                        const titleEl = document.getElementById(`gtitle-${i}`);
                        if (data.groupNames && data.groupNames[`g${i}`]) {
                            titleEl.innerText = data.groupNames[`g${i}`];
                        }
                        if (data.positions && data.positions[`gtitle-${i}`]) {
                            const pos = data.positions[`gtitle-${i}`];
                            titleEl.style.transform = `translate(${pos.x}px, ${pos.y}px)`;
                            titleEl.setAttribute('data-x', pos.x);
                            titleEl.setAttribute('data-y', pos.y);
                        }
                    }

                    checkConsecutivePlacements(globalHistory);
                }
            } catch (e) {
                console.error("데이터 로드 실패:", e);
            }
        }

        // 전체 데이터를 파이어베이스에 저장
        async function saveData() {
            const btn = document.getElementById('saveBtn');
            btn.innerText = "DB에 기록 중...";
            
            const currentMonth = document.getElementById('month').innerText.trim();
            const currentSeats = [];
            const positions = {};
            const groupNames = {};
            
            // 좌석 정보 추출
            for(let i = 0; i < 25; i++) {
                currentSeats.push(document.getElementById(`seat-${i}`).innerText.trim());
                const boxEl = document.getElementById(`sbox-${i}`);
                positions[`sbox-${i}`] = {
                    x: parseFloat(boxEl.getAttribute('data-x')) || 0,
                    y: parseFloat(boxEl.getAttribute('data-y')) || 0
                };
            }

            // 모둠 타이틀 정보 추출
            for(let i = 1; i <= 7; i++) {
                const titleEl = document.getElementById(`gtitle-${i}`);
                groupNames[`g${i}`] = titleEl.innerText.trim();
                positions[`gtitle-${i}`] = {
                    x: parseFloat(titleEl.getAttribute('data-x')) || 0,
                    y: parseFloat(titleEl.getAttribute('data-y')) || 0
                };
            }

            // 연속 배치 기록용 뒷자리 추출
            const currentBackRowStudents = BACK_ROW_INDEXES
                .map(index => currentSeats[index])
                .filter(name => name !== '');

            globalHistory[currentMonth] = currentBackRowStudents;

            try {
                await setDoc(docRef, {
                    month: currentMonth,
                    seats: currentSeats,
                    groupNames: groupNames,
                    positions: positions,
                    history: globalHistory
                });
                alert("배치 및 텍스트 데이터 DB 저장 완료");
                checkConsecutivePlacements(globalHistory);
            } catch (e) {
                console.error("저장 실패:", e);
                alert("저장 실패. 파이어베이스 보안 규칙(Test Mode)을 다시 확인해라.");
            } finally {
                btn.innerText = "현재 화면 그대로 DB 저장하기";
            }
        }

        // 연속 배치 감지 팩트체크 로직
        function checkConsecutivePlacements(history) {
            const currentMonth = document.getElementById('month').innerText.trim();
            const currentSeats = [];
            for(let i = 0; i < 25; i++) {
                currentSeats.push(document.getElementById(`seat-${i}`).innerText.trim());
            }
            
            const currentBackRowStudents = BACK_ROW_INDEXES
                .map(index => currentSeats[index])
                .filter(name => name !== '');

            const pastMonths = Object.keys(history).filter(m => m !== currentMonth);
            const warningBox = document.getElementById('warning-box');
            
            if (pastMonths.length > 0) {
                const lastMonth = pastMonths[pastMonths.length - 1];
                const lastBackRowStudents = history[lastMonth] || [];

                const consecutiveStudents = currentBackRowStudents.filter(name => lastBackRowStudents.includes(name));

                if (consecutiveStudents.length > 0) {
                    warningBox.innerText = `🚨 경고: [${consecutiveStudents.join(', ')}] 학생은 이전 배치(${lastMonth})에 이어 맨 뒷줄 그룹(3, 5, 7모둠)에 2회 연속 배치됨.`;
                } else {
                    warningBox.innerText = "";
                }
            } else {
                warningBox.innerText = "";
            }
        }

        document.getElementById('saveBtn').addEventListener('click', saveData);
        window.onload = loadData;
    </script>
